<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J5 Trading Strategy — Pure Mathematics. Institutional Liquidity.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ==========================================================
           style.css — J5 Trading Strategy
           ========================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #d4af37;
            --gold-dark: #b8860b;
            --gold-light: #fef6e0;
            --blue-dark: #0b1e33;
            --blue-medium: #1a4d8b;
            --gray-bg: #f8fafc;
            --gray-border: #e2e8f0;
            --text-dark: #1a1f2e;
            --text-muted: #4a5568;
            --text-light: #718096;
            --success: #0f7b3a;
            --danger: #c62828;
            --danger-bg: #ffebee;
            --white: #ffffff;
            --shadow: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-hover: 0 12px 32px rgba(0,0,0,0.10);
            --radius: 12px;
            --transition: 0.25s ease;
            --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--gray-bg);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        /* ─── HEADER ─── */
        header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(6px);
            background: rgba(255,255,255,0.92);
        }
        .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .logo { font-size: 1.3rem; font-weight: 700; color: var(--blue-dark); }
        .logo-gold { color: var(--gold); }
        nav { display: flex; gap: 20px; flex-wrap: wrap; }
        nav a { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; transition: color var(--transition); position: relative; }
        nav a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: var(--gold); transition: width var(--transition); }
        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a:hover, nav a.active { color: var(--gold-dark); }
        .language-switcher { display: flex; gap: 4px; background: var(--gray-bg); border-radius: 24px; padding: 3px; border: 1px solid var(--gray-border); }
        .language-switcher button { background: transparent; border: none; border-radius: 20px; padding: 4px 14px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all var(--transition); color: var(--text-muted); text-transform: uppercase; }
        .language-switcher button.active { background: var(--gold); color: var(--white); box-shadow: 0 2px 8px rgba(212,175,55,0.3); }
        .language-switcher button:hover:not(.active) { color: var(--blue-dark); background: var(--gold-light); }

        /* ─── HERO ─── */
        .hero { background: var(--white); padding: 60px 0 50px; border-bottom: 1px solid var(--gray-border); }
        .hero-inner { display: flex; align-items: center; gap: 50px; flex-wrap: wrap; }
        .hero-text { flex: 1 1 55%; }
        .hero-text h1 { font-size: 2.8rem; font-weight: 700; color: var(--blue-dark); line-height: 1.1; margin-bottom: 8px; }
        .hero-sub { font-size: 1.2rem; color: var(--gold-dark); font-weight: 500; margin-bottom: 12px; }
        .hero-description { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 24px; max-width: 600px; }
        .hero-buttons { display: flex; gap: 14px; flex-wrap: wrap; }
        .btn-primary { display: inline-block; background: var(--gold); color: var(--white); padding: 12px 32px; border-radius: 40px; font-weight: 600; font-size: 0.9rem; transition: all var(--transition); border: none; cursor: pointer; }
        .btn-primary:hover { background: var(--gold-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.3); }
        .btn-secondary { display: inline-block; border: 2px solid var(--gold); color: var(--gold-dark); padding: 10px 28px; border-radius: 40px; font-weight: 600; font-size: 0.9rem; transition: all var(--transition); background: transparent; cursor: pointer; }
        .btn-secondary:hover { background: var(--gold-light); transform: translateY(-2px); }
        .hero-image { flex: 1 1 30%; text-align: center; }
        .hero-image img { border-radius: var(--radius); box-shadow: var(--shadow); max-height: 340px; width: auto; object-fit: cover; border: 2px solid var(--gold-light); }

        /* ─── METRICS ─── */
        .metrics { padding: 40px 0 30px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .metric-card { background: var(--white); border-radius: var(--radius); padding: 22px 16px; text-align: center; border: 1px solid var(--gray-border); box-shadow: var(--shadow); transition: all var(--transition); }
        .metric-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .metric-card .number { font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
        .metric-card .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 4px; }
        .metric-card.gold .number { color: var(--gold-dark); }
        .metric-card.green .number { color: var(--success); }
        .metric-card.blue .number { color: var(--blue-medium); }

        /* ─── JOURNEY, ACHIEVEMENTS, J5 SYSTEM, PHILOSOPHY ─── */
        .journey, .achievements, .j5-system, .philosophy { padding: 50px 0 40px; background: var(--white); }
        .journey h2, .achievements h2, .j5-system h2, .philosophy h2 { font-size: 1.8rem; color: var(--blue-dark); margin-bottom: 28px; }
        .metrics, .achievements { background: var(--gray-bg); }
        
        /* Timeline */
        .timeline { display: flex; flex-direction: column; gap: 6px; }
        .timeline-item { padding: 14px 20px; border-left: 4px solid var(--gray-border); transition: background var(--transition); border-radius: 0 var(--radius) var(--radius) 0; }
        .timeline-item:hover { background: var(--gray-bg); }
        .timeline-item.highlight { border-left-color: var(--gold); background: var(--gold-light); }
        .timeline-date { font-size: 0.7rem; font-weight: 600; color: var(--gold-dark); text-transform: uppercase; letter-spacing: 0.05em; }
        .timeline-title { font-size: 1.05rem; font-weight: 600; color: var(--blue-dark); }
        .timeline-desc { font-size: 0.92rem; color: var(--text-muted); }

        /* Grids */
        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .achievement-item { background: var(--white); border-radius: var(--radius); padding: 14px 18px; border: 1px solid var(--gray-border); font-size: 0.9rem; box-shadow: var(--shadow); transition: all var(--transition); display: flex; align-items: center; gap: 10px; }
        .achievement-item:hover { transform: translateX(4px); border-color: var(--gold); }
        .system-grid { display: flex; gap: 40px; flex-wrap: wrap; }
        .system-text { flex: 1 1 55%; }
        .system-text p { margin-bottom: 12px; font-size: 0.95rem; }
        .system-image { flex: 1 1 35%; text-align: center; }
        .system-image img { border-radius: var(--radius); border: 1px solid var(--gray-border); box-shadow: var(--shadow); max-height: 320px; object-fit: contain; }
        .philosophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
        .philosophy-item { background: var(--white); border-radius: var(--radius); padding: 24px 20px; text-align: center; border: 1px solid var(--gray-border); box-shadow: var(--shadow); transition: all var(--transition); }
        .philosophy-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .philosophy-item .icon { font-size: 2.4rem; margin-bottom: 6px; }
        .philosophy-item h3 { font-size: 1.1rem; color: var(--blue-dark); margin-bottom: 6px; }
        .philosophy-item p { font-size: 0.9rem; color: var(--text-muted); }

        /* ─── MARKET NEWS SECTION ─── */
        .market-news {
            padding: 60px 0 50px;
            background: var(--gray-bg);
        }
        .market-news h2 {
            font-size: 1.8rem;
            color: var(--blue-dark);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .news-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--gray-border);
            box-shadow: var(--shadow);
            display: flex;
            overflow: hidden;
            flex-wrap: wrap;
            transition: all var(--transition);
        }
        .news-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }
        .news-content {
            padding: 32px;
            flex: 1 1 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .news-badge {
            align-self: flex-start;
            background: var(--gold-light);
            color: var(--gold-dark);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid var(--gold);
        }
        .news-content h3 {
            font-size: 1.5rem;
            color: var(--blue-dark);
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .news-content p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.7;
        }
        .news-image {
            flex: 1 1 45%;
            background: #131722;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--gray-border);
            padding: 16px;
        }
        .news-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 280px;
            border-radius: 6px;
        }

        /* ─── QUOTE ─── */
        .quote-section { padding: 50px 0 40px; background: var(--blue-dark); text-align: center; }
        .quote-section blockquote { font-size: 1.4rem; font-weight: 400; color: var(--white); max-width: 720px; margin: 0 auto 10px; font-style: italic; line-height: 1.5; }
        .quote-section cite { color: var(--gold); font-style: normal; font-weight: 500; font-size: 1rem; }

        /* ─── FOOTER ─── */
        footer { background: var(--white); border-top: 1px solid var(--gray-border); padding: 30px 0 24px; }
        .footer-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
        .footer-left .logo { font-size: 1.1rem; }
        .footer-left p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .footer-right { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
        .footer-right a { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; transition: color var(--transition); }
        .footer-right a:hover { color: var(--gold-dark); }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 992px) {
            .news-card { flex-direction: column; }
            .news-image { order: -1; border-left: none; border-bottom: 1px solid var(--gray-border); }
        }
        @media (max-width: 768px) {
            .hero-inner { flex-direction: column; text-align: center; }
            .header-inner { flex-direction: column; gap: 10px; }
            .system-grid { flex-direction: column; }
        }
    </style>
</head>
